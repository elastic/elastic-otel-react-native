name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm ci
        run: npm ci
      - name: npm run validate:js-android
        run: npm run validate:js-android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm ci
        run: npm ci
      - name: npm run validate:ios
        run: npm run validate:ios

  expo-android:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
    steps:
      - uses: actions/checkout@v7
      # Removes unused preinstalled toolchains; the API 36 emulator needs the space.
      - name: Free disk space for the Android emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - name: npm ci
        run: npm ci
      - name: npm run validate:expo:android
        run: npm run validate:expo:android
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The API level matches the Expo fixture's targetSdkVersion.
      - name: npm run test:expo-launch:android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          script: npm run test:expo-launch:android

  expo-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm ci
        run: npm ci
      - name: npm run validate:expo:ios
        run: npm run validate:expo:ios
      - name: npm run test:expo-launch:ios
        run: npm run test:expo-launch:ios

  minimum-android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run validate:minimum:bare:android
      - run: npm run validate:minimum:expo:android

  minimum-bare-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - run: npm ci
      - name: Install the selected CocoaPods
        run: |
          minimum_cocoapods=$(node -p 'require("./minimum-fixtures/toolchains.json").cocoaPods')
          sudo gem install cocoapods --version "$minimum_cocoapods" --no-document
      - run: npm run validate:minimum:bare:ios

  minimum-expo-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.2"
      - run: npm ci
      - name: Install the selected CocoaPods
        run: |
          minimum_cocoapods=$(node -p 'require("./minimum-fixtures/toolchains.json").cocoaPods')
          sudo gem install cocoapods --version "$minimum_cocoapods" --no-document
      - run: npm run validate:minimum:expo:ios

  # Reports whether every job passed. This is the required check.
  ci:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - js-android
      - ios
      - expo-android
      - expo-ios
      - minimum-android
      - minimum-bare-ios
      - minimum-expo-ios
    steps:
      - id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}
      - run: ${{ steps.check.outputs.is-success }}
