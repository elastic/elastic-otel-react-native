name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm ci
        run: npm ci
      - name: npm run validate:linux
        run: npm run validate:linux

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm ci
        run: npm ci
      # The iOS group needs the external fixture from setup:test and the
      # Android autolinking output from fixture:build.
      - name: npm run setup:test
        run: npm run setup:test
      - name: npm run fixture:build
        run: npm run fixture:build
      - name: npm run validate:ios
        run: npm run validate:ios

  expo:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm ci
        run: npm ci
      - name: npm run validate:expo
        run: npm run validate:expo

  # Reports whether every job passed. This is the required check.
  ci:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - linux
      - ios
      - expo
    steps:
      - id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}
      - run: ${{ steps.check.outputs.is-success }}
