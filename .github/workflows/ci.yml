name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm ci
        run: npm ci
      - name: npm run validate:js-android
        run: npm run validate:js-android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm ci
        run: npm ci
      # The iOS group needs the external fixture from setup:test and the
      # Android autolinking output from fixture:build.
      - name: npm run setup:test
        run: npm run setup:test
      - name: npm run fixture:build
        run: npm run fixture:build
      - name: npm run validate:ios
        run: npm run validate:ios

  expo-android:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: npm ci
        run: npm ci
      - name: npm run validate:expo:android
        run: npm run validate:expo:android
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The API level matches the Expo fixture's targetSdkVersion.
      - name: npm run test:expo-launch:android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          disk-size: 2G
          script: npm run test:expo-launch:android

  expo-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: npm ci
        run: npm ci
      - name: npm run validate:expo:ios
        run: npm run validate:expo:ios
      - name: npm run test:expo-launch:ios
        run: npm run test:expo-launch:ios

  # Reports whether every job passed. This is the required check.
  ci:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - js-android
      - ios
      - expo-android
      - expo-ios
    steps:
      - id: check
        uses: elastic/oblt-actions/check-dependent-jobs@v1
        with:
          jobs: ${{ toJSON(needs) }}
      - run: ${{ steps.check.outputs.is-success }}
