# The repository token policy is bound to this file's path on any branch,
# because patches prepare from patching/x.y.z.
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release-note JSON. Use the Draft release notes workflow.
        required: true
        type: string

permissions:
  contents: read

# One preparation at a time, so two dispatches cannot both pass the
# release-in-flight check before either has pushed its branches.
concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Get repository write token
        id: token
        uses: elastic/oblt-actions/github/create-token@v1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - uses: elastic/oblt-actions/git/setup@v1
        with:
          github-token: ${{ steps.token.outputs.token }}

      - name: Prepare release changes
        id: prepare
        uses: elastic/oblt-actions/edot-release/prepare-start@v1
        with:
          notes: ${{ inputs.release_notes }}
          github-token: ${{ steps.token.outputs.token }}

      # Regenerate NOTICE.txt from the installed runtime tree, so the
      # preparation commit ships it with the release changes.
      - name: Regenerate NOTICE.txt
        if: steps.prepare.outputs.prepared == 'true'
        run: |
          npm ci --ignore-scripts
          npm run notice:generate

      - name: Open preparation pull request
        if: steps.prepare.outputs.prepared == 'true'
        uses: elastic/oblt-actions/edot-release/prepare-finish@v1
        with:
          release: ${{ steps.prepare.outputs.release }}
          github-token: ${{ steps.token.outputs.token }}
