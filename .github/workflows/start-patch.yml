# The repository token policy is bound to this file's path on main.
name: Start patch

on:
  workflow_dispatch:
    inputs:
      line:
        description: Release line in X.Y form.
        required: true
        type: string
      pull_requests:
        description: Optional main PR numbers separated by commas, such as 12,34.
        required: false
        type: string

permissions:
  contents: read

jobs:
  start-patch:
    name: Start patch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - name: Get repository write token
        id: token
        uses: elastic/oblt-actions/github/create-token@v1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - uses: elastic/oblt-actions/git/setup@v1
        with:
          github-token: ${{ steps.token.outputs.token }}

      - name: Start patch
        uses: elastic/oblt-actions/edot-release/start-patch@v1
        with:
          line: ${{ inputs.line }}
          pull-requests: ${{ inputs.pull_requests }}
          github-token: ${{ steps.token.outputs.token }}
