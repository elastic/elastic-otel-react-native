# The repository token policy is bound to this file's path on main.
name: updatecli

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-fixture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pull requests opened with the workflow's GITHUB_TOKEN start no CI, so
      # updatecli uses an ephemeral token from the repository token policy.
      - name: Get repository write token
        id: repository-token
        uses: elastic/oblt-actions/github/create-token@v1
      - name: Update the Expo fixture
        uses: elastic/oblt-actions/updatecli/run@v1
        with:
          command: apply --config .ci/updatecli/expo-fixture.yml
        env:
          GITHUB_TOKEN: ${{ steps.repository-token.outputs.token }}
