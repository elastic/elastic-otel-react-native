// Copies elastic-otel-config.json from the React Native project root into the
// application assets, where ElasticOtelReactNative.initialize(application)
// reads it. Apply this script from android/app/build.gradle:
//
//   apply from: "../../node_modules/@elastic/otel-react-native/android/elastic-otel-config.gradle"

def elasticOtelConfigFile = new File(rootProject.projectDir.parentFile, "elastic-otel-config.json")

if (elasticOtelConfigFile.isFile()) {
    def elasticOtelAssetsDirectory = layout.buildDirectory.dir("generated/elasticOtel/assets")
    def copyElasticOtelConfig = tasks.register("copyElasticOtelConfig", Sync) {
        from(elasticOtelConfigFile)
        into(elasticOtelAssetsDirectory)
    }
    android.sourceSets.main.assets.srcDirs += elasticOtelAssetsDirectory.get().asFile
    preBuild.dependsOn(copyElasticOtelConfig)
} else {
    logger.warn(
        "EDOT React Native: ${elasticOtelConfigFile.absolutePath} was not found. " +
            "ElasticOtelReactNative.initialize(this) fails at startup without it."
    )
}
