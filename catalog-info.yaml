# Declare your Buildkite pipelines below
---
# yaml-language-server: $schema=https://gist.githubusercontent.com/elasticmachine/988b80dae436cafea07d9a4a460a011d/raw/rre.schema.json
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: buildkite-pipeline-elastic-otel-react-native
  description: Buildkite Pipeline for elastic-otel-react-native
  links:
    - title: Pipeline
      url: https://buildkite.com/elastic/elastic-otel-react-native

spec:
  type: buildkite-pipeline
  owner: group:obs-signals-traces-approvers
  system: buildkite
  implementation:
    apiVersion: buildkite.elastic.dev/v1
    kind: Pipeline
    metadata:
      name: elastic-otel-react-native
      description: 
    spec:
      repository: elastic/elastic-otel-react-native
      pipeline_file: ".buildkite/pipeline.yml"
      provider_settings:
        build_pull_request_forks: true
      teams:
        obs-signals-traces-approvers:
          access_level: MANAGE_BUILD_AND_READ
        everyone:
          access_level: READ_ONLY
